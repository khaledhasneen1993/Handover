name: Import preserved Handover source
on:
  push:
    branches: [main]
    paths:
      - handover-source.tar.xz.base64
      - .github/workflows/import-source.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack preserved development source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d handover-source.tar.xz.base64 > "$RUNNER_TEMP/handover-source.tar.xz"
          mkdir -p "$RUNNER_TEMP/handover-unpacked"
          tar -xJf "$RUNNER_TEMP/handover-source.tar.xz" -C "$RUNNER_TEMP/handover-unpacked" --no-same-owner
          test -f "$RUNNER_TEMP/handover-unpacked/app/build.gradle.kts"
          test -f "$RUNNER_TEMP/handover-unpacked/settings.gradle.kts"
          test -f "$RUNNER_TEMP/handover-unpacked/tools/source_sanity.py"
          rsync -a --ignore-existing --exclude='.git' "$RUNNER_TEMP/handover-unpacked/" ./
          python3 tools/source_sanity.py
          echo "Imported source files: $(find app -type f | wc -l)"
      - name: Commit imported source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "All source files already exist"
          else
            git commit -m "feat: expand preserved Handover Android source"
            git push origin HEAD:main
# Trigger source import after GitHub connection authorization was repaired.
          fi
