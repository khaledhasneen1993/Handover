name: Generate official Gradle wrapper
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-wrapper.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Generate and verify wrapper from installed Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          test -s gradle/wrapper/gradle-wrapper.jar
          jar tf gradle/wrapper/gradle-wrapper.jar | grep -q 'org/gradle/wrapper/GradleWrapperMain.class'
          sha256sum gradle/wrapper/gradle-wrapper.jar
          grep -q gradle-9.3.1-bin.zip gradle/wrapper/gradle-wrapper.properties
      - name: Commit verified reproducible wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: add official Gradle 9.3.1 wrapper [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
