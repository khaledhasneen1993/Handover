name: Restore official Gradle wrapper
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/gradle-wrapper.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate official wrapper using an isolated Gradle project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wrapper-bootstrap"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$RUNNER_TEMP/wrapper-bootstrap/settings.gradle.kts"
          (cd "$RUNNER_TEMP/wrapper-bootstrap" && gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin)
          cp "$RUNNER_TEMP/wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
          cp "$RUNNER_TEMP/wrapper-bootstrap/gradlew" gradlew
          cp "$RUNNER_TEMP/wrapper-bootstrap/gradlew.bat" gradlew.bat
          chmod +x gradlew
          sha256sum gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.jar
      - name: Commit reproducible wrapper without signing credentials
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          if ! git diff --cached --quiet; then
            git commit -m "build: install official Gradle 9.3.1 wrapper [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
