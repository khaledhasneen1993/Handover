name: Android quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - name: Build, lint and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease :app:lintDebug :app:testDebugUnitTest
      - name: Publish development build artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handover-development-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
# Never upload production signing keys. The release bundle remains unsigned.
