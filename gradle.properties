org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
org.gradle.caching=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# KSP 2.2.x still registers generated directories through kotlin.sourceSets with AGP 9.1 built-in Kotlin.
# Compatibility setting documented by Android and google/ksp issue #2729; revisit after KSP upgrade.
android.disallowKotlinSourceSets=false
